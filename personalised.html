<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk off the sugar spike – variant B: personal trigger</title>
<style>
  :root {
    --paper: #ffffff;
    --field: #f3f4f1;
    --ink: #15181a;
    --ink-2: #43484b;
    --ink-3: #666b6e;
    --rule: #dedad2;
    --rule-2: #c9c3b8;
    --sign: #ffd100;
    --spike: #d4520f;
    --walk: #1f7a4d;
    --walk-d: #17603c;
    --walk-l: #e6f2ea;
    --low: #2c66b0;
    --ios-bg: #f2f2f7;
    --ios-cell: #ffffff;
    --ios-label: #000000;
    --ios-2: #6c6c70;
    --ios-sep: rgba(60, 60, 67, .18);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--field);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
  b, strong { font-weight: 650; }

  /* ================= Masthead ================= */
  .mast { background: var(--sign); color: var(--ink); }
  .mast-in { max-width: 1240px; margin: 0 auto; padding: 20px 40px 18px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 32px; }
  .mast h1 { margin: 0; font-family: var(--display); font-size: 32px; line-height: 1.1; font-weight: 750; letter-spacing: -.024em; }
  .mast p { margin: 6px 0 0; font-size: 16px; font-weight: 500; color: #2f2a12; }
  .mast a { color: var(--ink); font-size: 14.5px; font-weight: 650; text-underline-offset: 3px; white-space: nowrap; }
  .mast a:hover { text-decoration-thickness: 2px; }
  @media (max-width: 760px) {
    .mast-in { padding: 18px 16px 16px; }
    .mast h1 { font-size: 26px; }
    .mast p { font-size: 15px; }
  }

  /* ================= Stage: phone centred, controls on the right ================= */
  .stage-in { max-width: 1240px; margin: 0 auto; padding: 36px 40px 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-areas: ". phone ctrl"; gap: 0 36px; align-items: start; }
  .phone { grid-area: phone; }
  .ctrl { grid-area: ctrl; justify-self: start; width: 280px; margin-top: 120px; }
  .caption { position: relative; background: var(--ink); color: #fff; border-radius: 14px; padding: 13px 16px 14px; font-size: 16px; line-height: 1.45; min-height: 122px;
    margin-bottom: 18px; box-shadow: 0 12px 28px -12px rgba(21, 24, 26, .5); }
  .caption::after { content: ""; position: absolute; left: -8px; top: 24px; width: 16px; height: 16px; background: var(--ink); transform: rotate(45deg); border-radius: 2px; }
  .caption .kick { display: block; margin-bottom: 4px; font-size: 11.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--sign); }
  .caption p { margin: 0; position: relative; z-index: 1; }
  .mnote { display: none; }

  @media (max-width: 1099px) {
    .stage-in { grid-template-columns: auto 280px; grid-template-areas: "phone ctrl"; justify-content: center; gap: 0 32px; padding: 28px 24px 40px; }
  }
  @media (max-width: 760px) {
    .stage-in { grid-template-columns: minmax(0, 1fr); grid-template-areas: "ctrl" "phone"; justify-items: center; padding: 16px 12px 28px; }
    .ctrl { width: 100%; max-width: 412px; margin: 0 0 18px; justify-self: center; }
    .caption { display: none; }
    .mnote { display: block; margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: var(--ink); min-height: 3em; }
  }

  /* ================= Controls ================= */
  .demo { background: var(--paper); border: 1px solid var(--rule-2); border-radius: 12px; padding: 16px 18px 14px; font-size: 14px; line-height: 1.4; }
  .demo-lbl { margin: 0; font-size: 11.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .trail { list-style: none; margin: 14px 0 0; padding: 0 0 0 26px; position: relative; display: grid; gap: 8px; }
  .trail::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 14px; border-left: 2px dashed var(--rule-2); }
  .trail li { position: relative; }
  .trail li::before { content: ""; position: absolute; left: -26px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--paper); border: 2px solid var(--rule-2); transition: background .2s, border-color .2s; }
  .trail li:has(.next)::before { background: var(--sign); border-color: var(--ink); box-shadow: 0 0 0 3px rgba(255, 209, 0, .35); }
  .trail li:has(.done)::before { background: var(--ink); border-color: var(--ink); }
  .trail li:has(.done)::after { content: ""; position: absolute; left: -21px; top: 50%; width: 4px; height: 7px; margin-top: -5px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .dbtn { width: 100%; border: 1px solid var(--rule-2); background: var(--paper); border-radius: 8px; padding: 9px 11px; text-align: left; font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.3; transition: background .15s, border-color .15s, color .15s; }
  .dbtn:not(:disabled):hover { border-color: var(--ink); background: var(--field); }
  .dbtn.next:not(:disabled) { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .dbtn.next:not(:disabled):hover { background: #2b3033; }
  .dbtn:disabled { color: #9a9ea0; border-color: var(--rule); background: transparent; }
  .dbtn.done:disabled { color: var(--ink-3); }
  .dbtn.chosen:disabled { color: var(--ink); border-color: var(--ink-3); }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .choice .dbtn { text-align: center; padding: 9px 4px; font-size: 13.5px; }
  .reset { border: 0; background: none; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 13.5px; padding: 10px 0 0; }
  .reset:hover { color: var(--ink); }

  /* ================= Phone (real iPhone size: 390 x 844 screen) ================= */
  .phone { flex: none; width: min(412px, calc(100vw - 24px)); aspect-ratio: 412 / 866; border-radius: 58px; background: #121314; padding: 11px; position: relative;
    box-shadow: 0 1px 0 1px #2d3133 inset, 0 2px 4px rgba(21, 24, 26, .18), 0 24px 48px -12px rgba(21, 24, 26, .38); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 47px; overflow: hidden; background: var(--ios-bg); color: var(--ios-label); font-size: 16px; line-height: 1.35; letter-spacing: -.01em; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; border-radius: 20px; background: #000; z-index: 30; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 18px 32px 0 40px; display: flex; justify-content: space-between; font-size: 17px; font-weight: 600; z-index: 25; font-variant-numeric: tabular-nums; }
  .statusbar svg { display: block; }
  .sb-icons { display: flex; gap: 6px; align-items: center; }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: #000; z-index: 40; }

  .view { position: absolute; inset: 54px 0 0 0; overflow-y: auto; padding: 8px 16px 40px; background: var(--ios-bg); transition: opacity .3s ease, transform .3s cubic-bezier(.2, .8, .2, 1); scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }
  .view.hidden { opacity: 0; transform: translateX(28px); pointer-events: none; visibility: hidden; transition: opacity .2s, transform .2s, visibility 0s .2s; }

  .app-head { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 14px; }
  .app-head h2, .wk-title { margin: 0; font-family: var(--display); font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.022em; }
  .pill { font-size: 15px; font-weight: 600; color: #3c3c43; background: #e3e3e8; padding: 6px 12px; border-radius: 99px; white-space: nowrap; }

  .reading { display: flex; align-items: center; gap: 12px; background: var(--ios-cell); border-radius: 18px; padding: 16px 20px; }
  .big { font-family: var(--display); font-size: 72px; font-weight: 700; letter-spacing: -.035em; line-height: .95; transition: color .3s; font-variant-numeric: tabular-nums; }
  .big.high { color: var(--spike); }
  .big.low { color: var(--low); }
  .unit { font-size: 16px; color: var(--ios-2); font-weight: 600; margin-top: 4px; }
  .trend { margin-left: auto; text-align: right; }
  .trend svg { display: block; margin: 0 0 6px auto; transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
  .trend b { display: block; font-size: 21px; font-weight: 650; letter-spacing: -.015em; }

  .chart-card { background: var(--ios-cell); border-radius: 18px; padding: 12px 6px 6px; margin-top: 12px; }
  .chart-card svg { display: block; width: 100%; height: auto; }
  .chart-card { padding: 14px 6px 12px; }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 8px 6px; }
  .chart-head h4 { margin: 0; font-size: 18px; font-weight: 600; }
  .chart-head span { font-size: 14px; color: #6c6c70; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 8px 0; font-size: 14px; color: #3a3a3c; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend i { display: inline-block; width: 16px; height: 10px; border-radius: 3px; }
  .chart-legend .lg-band { background: #e6f2ea; border: 1px solid #a9cdb5; }
  .chart-legend .lg-high { background: #d4520f; height: 4px; }
  .chart-legend .lg-low { background: #2c66b0; height: 4px; }
  .cursor-dot { animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: .5; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }

  .pcard { margin-top: 12px; background: var(--ios-cell); border-radius: 18px; padding: 16px 18px; animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .pcard h4 { margin: 0 0 4px; font-size: 19px; line-height: 1.25; font-weight: 650; letter-spacing: -.015em; display: flex; align-items: center; gap: 8px; }
  .pcard h4::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--walk); }
  .pcard.warn h4::before { background: var(--low); }
  .pcard p { margin: 0; font-size: 17px; color: var(--ios-2); line-height: 1.35; }
  .pcard.on { display: flex; align-items: center; gap: 10px; padding: 12px 18px; font-size: 16px; font-weight: 600; color: var(--walk-d); background: var(--walk-l); }
  .pcard.on svg { flex: none; }
  .steps-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .steps-row b { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .steps-lbl { font-size: 16px; color: var(--ios-2); }
  .steps-lbl small { display: block; font-size: 14px; color: #8e8e93; }
  .bar { height: 8px; background: #e5e5ea; border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--walk); border-radius: 4px; }

  /* Insight screen */
  .ins-kick { margin: 10px 2px 2px; font-size: 15px; font-weight: 650; color: var(--walk-d); }
  .ins-title { margin: 0 2px; font-family: var(--display); font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.022em; }
  .ins-body { margin: 16px 2px 0; font-size: 17px; line-height: 1.45; }
  .tip { display: flex; gap: 14px; align-items: center; margin-top: 14px; background: var(--walk-l); border-radius: 16px; padding: 14px 16px; }
  .tip p { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 600; color: var(--walk-d); }
  .tip-badge { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--walk); color: #fff; display: grid; place-content: center; text-align: center; line-height: 1; }
  .tip-badge b { font-size: 22px; font-weight: 700; }
  .tip-badge span { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .vbtns { display: grid; gap: 2px; margin-top: 18px; }
  .btn-primary { border: 0; background: var(--walk); color: #fff; font-weight: 600; font-size: 18px; padding: 17px; border-radius: 16px; }
  .btn-primary:hover { background: var(--walk-d); }
  .btn-text { border: 0; background: transparent; color: var(--walk-d); font-size: 18px; padding: 12px; }

  /* Week screen */
  .back { border: 0; background: none; color: var(--walk); font-size: 17px; padding: 6px 0; display: inline-flex; align-items: center; gap: 4px; margin-left: -4px; }
  .wk-title { margin: 6px 2px 16px; }
  .wk-list { background: var(--ios-cell); border-radius: 18px; padding: 0 20px; }
  .wk-item { padding: 18px 0 20px; }
  .wk-item + .wk-item { border-top: .5px solid var(--ios-sep); }
  .wk-lbl { margin: 0; font-size: 17px; color: var(--ios-2); }
  .wk-val { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
  .wk-val b { font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .wk-val span { font-size: 17px; color: var(--ios-2); }
  .wk-val .ok { font-size: 16px; font-weight: 650; color: var(--walk-d); background: var(--walk-l); padding: 4px 12px; border-radius: 99px; align-self: center; }
  .wk-val .meh { font-size: 16px; font-weight: 650; color: #3c3c43; background: #e3e3e8; padding: 4px 12px; border-radius: 99px; align-self: center; }

  /* Push banner (lock-screen style, no action buttons) */
  .push { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 50; background: rgba(245, 245, 247, .92); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8); border-radius: 26px; padding: 14px 16px; display: flex; gap: 12px; box-shadow: 0 12px 32px -6px rgba(0, 0, 0, .28); transform: translateY(-150%); opacity: 0; transition: transform .55s cubic-bezier(.2, 1.1, .35, 1), opacity .3s ease; }
  .push.show { transform: translateY(0); opacity: 1; }
  .push .appicon { flex: none; width: 42px; height: 42px; border-radius: 10px; background: var(--walk); display: grid; place-items: center; }
  .push .pbody { flex: 1; min-width: 0; }
  .push .meta { display: flex; justify-content: space-between; font-size: 14px; color: #6b6b70; }
  .push .ptitle { margin: 1px 0 2px; font-size: 17px; font-weight: 600; }
  .push p { margin: 0; font-size: 16px; line-height: 1.3; color: #1d1d1f; }

  /* iOS permission dialog */
  .overlay { position: absolute; inset: 0; z-index: 60; background: rgba(0, 0, 0, .3); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .ios-alert { width: 290px; border-radius: 14px; background: rgba(242, 242, 247, .97); text-align: center; overflow: hidden; transform: scale(1.1); transition: transform .25s cubic-bezier(.2, .9, .25, 1); }
  .overlay.show .ios-alert { transform: scale(1); }
  .ios-alert .atitle { margin: 0; padding: 20px 16px 4px; font-size: 17px; line-height: 1.3; font-weight: 600; }
  .ios-alert p { margin: 0; padding: 2px 16px 20px; font-size: 14px; line-height: 1.35; }
  .ios-btns { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid rgba(60, 60, 67, .3); }
  .ios-btns button { border: 0; background: none; color: #007aff; font-size: 17px; padding: 12px 0; }
  .ios-btns button + button { border-left: .5px solid rgba(60, 60, 67, .3); font-weight: 600; }
  .ios-btns button:hover { background: rgba(0, 0, 0, .04); }

  .snackbar { position: absolute; left: 14px; right: 14px; bottom: 28px; z-index: 55; background: #1c1c1e; color: #fff; border-radius: 16px; padding: 14px 16px; font-size: 16px; display: flex; gap: 10px; align-items: center; transform: translateY(140%); opacity: 0; transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .35s; }
  .snackbar.show { transform: none; opacity: 1; }
  .snackbar svg { flex: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
  #stepsBar { transition: width .25s linear; }
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <div>
      <h1 id="mTitle"></h1>
      <p id="mLine"></p>
    </div>
    <a href="index.html" id="mLink"></a>
  </div>
</header>

<section class="stage" aria-label="User flow prototype">
  <div class="stage-in">
    <div class="phone">
      <div class="screen" id="screen">
        <div class="island"></div>
        <div class="statusbar">
          <span id="sbTime">12:25</span>
          <span class="sb-icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#000"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#000"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#000"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#000"/></svg>
            <svg width="27" height="13" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.2" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="#000"/><rect x="23" y="4" width="1.6" height="4" rx=".8" fill="#000" opacity=".4"/></svg>
          </span>
        </div>

        <div class="push" id="push" role="status" aria-live="polite">
          <div class="appicon"><svg width="24" height="24" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 8 C3 8 3.5 2 6 2 S9 9 11 6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div class="pbody">
            <div class="meta"><span id="pushApp"></span><span id="pushWhen"></span></div>
            <div class="ptitle" id="pushTitle"></div>
            <p id="pushBody"></p>
          </div>
        </div>

        <!-- Home / Today -->
        <div class="view" id="vHome">
          <div class="app-head">
            <h2 id="homeTitle"></h2>
            <span class="pill" id="dayPill"></span>
          </div>
          <div class="reading">
            <div>
              <div class="big" id="gVal">95</div>
              <div class="unit">mg/dL</div>
            </div>
            <div class="trend">
              <svg id="gArrow" width="40" height="40" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="#e6f2ea"/><path d="M8 15 H21 M16 10 L21 15 L16 20" fill="none" stroke="#17603c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <b id="gTrend">Steady</b>
            </div>
          </div>
          <div class="chart-card">
            <div class="chart-head"><h4 id="chartHead"></h4><span data-unit></span></div>
            <svg id="chart" viewBox="0 0 340 242" role="img" aria-label="Glucose chart"></svg>
            <div class="chart-legend" data-legend></div>
          </div>
          <div id="homeCards"></div>
        </div>

        <!-- Personal insight -->
        <div class="view hidden" id="vInsight">
          <p class="ins-kick" id="insKick"></p>
          <h2 class="ins-title" id="insTitle"></h2>
          <div class="chart-card">
            <div class="chart-head"><h4 id="ichartHead"></h4><span data-unit></span></div>
            <svg id="ichart" viewBox="0 0 340 242" role="img" aria-label="Your glucose yesterday after lunch"></svg>
            <div class="chart-legend" data-legend></div>
          </div>
          <p class="ins-body" id="insBody"></p>
          <div class="tip"><div class="tip-badge" aria-hidden="true"><b id="tipNum"></b><span id="tipUnit"></span></div><p id="insTip"></p></div>
          <div class="vbtns">
            <button class="btn-primary" id="insYes"></button>
            <button class="btn-text" id="insNo"></button>
          </div>
        </div>

        <!-- Week summary -->
        <div class="view hidden" id="vWeek">
          <button class="back" id="weekBack"><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="weekBackLbl"></span></button>
          <h2 class="wk-title" id="weekTitle"></h2>
          <div class="wk-list" id="weekBody"></div>
        </div>

        <!-- iOS permission dialog -->
        <div class="overlay" id="perm" role="dialog" aria-modal="true" aria-labelledby="permTitle">
          <div class="ios-alert">
            <div class="atitle" id="permTitle"></div>
            <p id="permBody"></p>
            <div class="ios-btns">
              <button id="permDeny"></button>
              <button id="permAllow"></button>
            </div>
          </div>
        </div>

        <div class="snackbar" id="snack" role="status" aria-live="polite"></div>
        <div class="homebar"></div>
      </div>
    </div>

    <aside class="ctrl" aria-label="Demo controls">
      <div class="caption"><span class="kick" id="capKick"></span><p id="note" aria-live="polite"></p></div>
      <div class="demo">
        <p class="demo-lbl">Demo steps</p>
        <p class="mnote" id="noteM" aria-live="polite"></p>
        <ol class="trail">
          <li><button class="dbtn" id="b1"></button></li>
          <li><button class="dbtn" id="b2"></button></li>
          <li><button class="dbtn" id="b3"></button></li>
          <li><button class="dbtn" id="b4"></button></li>
          <li class="choice">
            <button class="dbtn" id="bWalk"></button>
            <button class="dbtn" id="bIgnore"></button>
          </li>
          <li><button class="dbtn" id="b6"></button></li>
        </ol>
        <button class="reset" id="bReset">Reset</button>
      </div>
    </aside>
  </div>
</section>

<script>
'use strict';
/* =====================================================================
   CONFIG – every number and every line of copy lives here.
   Times are "HH:MM"; glucose is mg/dL.
   ===================================================================== */
const CONFIG = {
  chart: {
    span: 240, yMin: 50, yMax: 190, low: 70, high: 140, sampleMin: 5, // 4-hour window, target band 70–140
    timeLabelInset: 30,                                                 // time labels sit 30 min in from each edge
    head: 'Glucose today', headInsight: 'Glucose yesterday', unit: 'mg/dL',
    legend: { band: 'Target 70–140', high: 'Spike', low: 'Dip' },
    lunchLabel: 'Lunch'
  },

  // Day 1: big lunch, no walk, dip, snack. Key points; a smooth curve passes through them.
  day1: {
    windowStart: '12:00', start: '12:25', lunch: '12:30', pauseAt: '14:35', snack: '14:40', end: '16:00',
    curve: [['12:00', 96], ['12:30', 95], ['12:45', 118], ['13:00', 150], ['13:15', 165], ['13:30', 156], ['13:45', 132],
            ['14:00', 104], ['14:15', 82], ['14:30', 74], ['14:40', 75], ['14:55', 96], ['15:10', 116], ['15:25', 112],
            ['15:45', 100], ['16:00', 94]],
    steps: 180, stepsBy: '14:30'                       // steps since lunch from Apple Health: low, no walk
  },

  // Day 2 morning, when the personal insight opens.
  morning: {
    windowStart: '06:00', now: '09:00',
    curve: [['06:00', 92], ['07:00', 90], ['07:30', 91], ['08:00', 108], ['08:20', 112], ['08:40', 101], ['09:00', 96]]
  },

  // Day 2: same lunch. The reminder fires when glucose rises this much within this many minutes of the meal.
  trigger: { rise: 30, windowMin: 30 },
  day2: {
    start: '12:25',
    // After the walk starts (curve continues from the trigger point): peak ~138, no deep dip.
    walkCurve: [['13:05', 127], ['13:20', 115], ['13:40', 104], ['14:00', 97], ['14:30', 93], ['14:50', 92],
                ['15:15', 94], ['15:40', 95], ['16:00', 95]],
    walkSteps: 1150, walkMinutes: 55   // demo: steps build up while glucose falls
  },

  // Demo animation lengths, seconds.
  anim: { lunch1: 10, snack: 5, lunch2: 3, outcome: 10 },
  weekTime: '19:00',

  // ---- Copy ----
  page: {
    title: 'Walk off the sugar spike – variant B: personal trigger',
    line: 'The app waits until your own data shows spike → dip → snack, then offers a walk reminder.',
    link: 'Variant A: alerts for everyone'
  },
  steps: {
    b1: 'Day 1: lunch', b2: 'Day 1: snack at 14:40', b3: 'Personal insight', b4: 'Day 2: lunch',
    walk: 'User walks', ignore: 'User ignores', b6: 'Week summary'
  },
  // One caption per step, one sentence, 15 words or fewer.
  captions: {
    start:    ['Day 1', 'The app only watches; it shows nothing new yet.'],
    lunch1:   ['Day 1: lunch', 'Lunch spikes glucose to 165, then it dips to 74 with only 180 steps.'],
    snack:    ['Day 1: snack', 'At 14:40, in the dip, the user snacks, so the app sees the pattern.'],
    insight:  ['Personal insight', 'Next morning the app shows the pattern on the user’s own curve; tap a button.'],
    on:       ['Personal insight', 'Reminder is on, only after lunches that spike like this one.'],
    notnow:   ['Personal insight', 'User tapped Not now: day 2 still runs, but no push will come.'],
    denied:   ['Personal insight', 'Notifications are off: day 2 still runs, but no push will come.'],
    lunch2:   ['Day 2: lunch', 'Glucose rises 30 mg/dL within 30 minutes, so the reminder fires.'],
    lunch2Off:['Day 2: lunch', 'Glucose rises just as fast, but reminders are off, so no push arrives.'],
    walk:     ['Day 2: user walks', 'Steps build up and glucose falls at the same time; no dip, no snack.'],
    ignore:   ['Day 2: user ignores', 'No walk: the dip comes back and the snack follows, as on day 1.'],
    week:     ['Week summary', 'Walks after big meals, fewer snacks, weight on-track.']
  },
  phone: {
    homeTitle: 'Today', day1: 'Day 1', day2: 'Day 2',
    trend: { up2: 'Rising fast', up1: 'Rising', flat: 'Steady', down1: 'Falling', down2: 'Falling fast' },
    stepsLabel: 'Steps since lunch', stepsSource: 'Apple Health',
    snackLabel: 'Snack', yesterdayLabel: 'Yesterday',
    reminderOn: 'Walk reminder on – after lunches like yesterday’s',
    snackbar: 'Walk reminder is on',
    walkEnd: { title: 'No dip, no snack today', body: 'About 200 kcal saved.' },
    dipBack: { title: 'The dip is back', body: 'Tomorrow, try 5 minutes.' }
  },
  insight: {
    kicker: 'From your own data',
    title: 'Why you snacked at {snack}',
    labels: { peak: 'Lunch spike {peak}', dip: 'Dip {dip}', snack: 'Snack {snack}' },
    body: 'Yesterday’s lunch spiked to {peak}. By {dipTime} you dipped to {dip} and snacked at {snack}. That snack was the dip.',
    tipNum: '10', tipUnit: 'min',
    tip: 'A 10-minute walk after lunch keeps the dip small.',
    primary: 'Remind me after meals like this',
    secondary: 'Not now'
  },
  permission: {
    title: '“Glow” Would Like to Send You Notifications',
    body: 'Notifications may include alerts, sounds, and icon badges. These can be configured in Settings.',
    deny: 'Don’t Allow', allow: 'Allow'
  },
  push: { app: 'GLOW', when: 'now', title: 'Same lunch as yesterday', body: 'Walk for 10 minutes now and skip the 14:40 snack.' },
  week: {
    title: 'This week', back: 'Today',
    on: [
      { label: 'Walks after big meals', value: '4 of 5' },
      { label: 'Afternoon snacks', value: '1', note: 'was 4' },
      { label: 'Weight this week', value: '−0.5 kg', badge: 'On-track', good: true }
    ],
    // Shown if the user turned the reminder down.
    off: [
      { label: 'Walks after big meals', value: '1 of 5' },
      { label: 'Afternoon snacks', value: '4', note: 'was 4' },
      { label: 'Weight this week', value: '−0.2 kg', badge: 'Below target pace', good: false }
    ]
  }
};

(() => {
  const $ = id => document.getElementById(id);
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const hhmm = m => { m = Math.round(m); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tpl = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
  const fmtInt = n => n.toLocaleString('en-US');
  const CH = CONFIG.chart, D1 = CONFIG.day1, D2 = CONFIG.day2, P = CONFIG.phone;

  /* ---------------- Curves: monotone cubic through key points (no overshoot) ---------------- */
  function spline(pts) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), n = pts.length, d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
      if (h > 9) { const s = 3 / Math.sqrt(h); m[i] = s * a * d[i]; m[i + 1] = s * b * d[i]; }
    }
    return t => {
      if (t <= xs[0]) return ys[0];
      if (t >= xs[n - 1]) return ys[n - 1];
      let i = 0; while (t > xs[i + 1]) i++;
      const h = xs[i + 1] - xs[i], s = (t - xs[i]) / h, s2 = s * s, s3 = s2 * s;
      return (2 * s3 - 3 * s2 + 1) * ys[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * ys[i + 1] + (s3 - s2) * h * m[i + 1];
    };
  }
  const keyPts = arr => arr.map(([t, g]) => [toMin(t), g]);
  const day1 = spline(keyPts(D1.curve));
  const morning = spline(keyPts(CONFIG.morning.curve));
  const LUNCH = toMin(D1.lunch), SNACK = toMin(D1.snack), END = toMin(D1.end);

  // Trigger: first minute after lunch when glucose is up by `rise` within `windowMin`.
  let TRIG = LUNCH + CONFIG.trigger.windowMin;
  for (let t = LUNCH; t <= LUNCH + CONFIG.trigger.windowMin; t++) {
    if (day1(t) - day1(LUNCH) >= CONFIG.trigger.rise) { TRIG = t; break; }
  }
  const walkCurve = spline([[TRIG, day1(TRIG)], ...keyPts(D2.walkCurve)]);

  // Day 1 landmarks for the insight (computed from the curve, not typed twice).
  let peakT = LUNCH, dipT = LUNCH;
  for (let t = LUNCH; t <= SNACK; t++) if (day1(t) > day1(peakT)) peakT = t;
  dipT = peakT;
  for (let t = peakT; t <= SNACK; t++) if (day1(t) < day1(dipT)) dipT = t;
  const LM = { peak: Math.round(day1(peakT)), dip: Math.round(day1(dipT)), dipTime: hhmm(dipT), snack: D1.snack };

  /* ---------------- State ---------------- */
  const ORDER = ['start', 'lunch1', 'lunch1done', 'snack', 'snackdone', 'insight', 'insightdone', 'lunch2', 'lunch2wait', 'outcome', 'outcomedone', 'week'];
  let S;
  function fresh() {
    return { phase: 'start', scene: 'd1', t: toMin(D1.start), reminder: null, choice: null, view: 'home', raf: null };
  }

  function valueAt(t) {
    if (S.scene === 'morning') return morning(t);
    if (S.scene === 'd2' && S.choice === 'walk' && t >= TRIG) return walkCurve(t);
    return day1(t);
  }
  function stepsAt(t) {
    if (S.scene === 'morning' || t <= LUNCH) return 0;
    const base = tt => Math.min(1, Math.max(0, (tt - LUNCH) / (toMin(D1.stepsBy) - LUNCH))) * D1.steps;
    if (S.scene === 'd2' && S.choice === 'walk' && t > TRIG) {
      const b = base(TRIG);
      return b + Math.min(1, (t - TRIG) / D2.walkMinutes) * (D2.walkSteps - b);
    }
    return base(t);
  }
  const windowStart = () => toMin(S.scene === 'morning' ? CONFIG.morning.windowStart : D1.windowStart);
  const snackShown = () => (S.scene === 'd1' || (S.scene === 'd2' && S.choice === 'ignore')) && S.t >= SNACK;

  /* ---------------- Chart ---------------- */
  // Labels use 17 viewBox units: 14 px or more on a 390 px wide page.
  const L = 38, R = 328, T = 32, B = 206, FS = 17;
  function chartSVG(o) {
    const X = t => L + (t - o.start) / CH.span * (R - L);
    const Y = g => B - (Math.max(CH.yMin, Math.min(CH.yMax, g)) - CH.yMin) / (CH.yMax - CH.yMin) * (B - T);
    const path = (f, a, b) => {
      const pts = [];
      for (let t = a; t < b; t += CH.sampleMin) pts.push([t, f(t)]);
      pts.push([b, f(b)]);
      return pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
    };
    const off = g => ((Y(g) - T) / (B - T) * 100).toFixed(2) + '%';
    const id = o.id;
    let s = `<defs><linearGradient id="lg-${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${T}" x2="0" y2="${B}">
      <stop offset="0" stop-color="#d4520f"/><stop offset="${off(CH.high)}" stop-color="#d4520f"/>
      <stop offset="${off(CH.high)}" stop-color="#1c1c1e"/><stop offset="${off(CH.low)}" stop-color="#1c1c1e"/>
      <stop offset="${off(CH.low)}" stop-color="#2c66b0"/><stop offset="1" stop-color="#2c66b0"/></linearGradient></defs>`;
    // target band with both limits labelled on the left
    s += `<rect x="${L}" y="${Y(CH.high)}" width="${R - L}" height="${Y(CH.low) - Y(CH.high)}" fill="#e6f2ea" rx="3"/>`;
    [CH.high, CH.low].forEach(v => {
      s += `<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#a9cdb5" stroke-dasharray="4 4"/>`;
      s += `<text x="${L - 6}" y="${Y(v) + 5}" font-size="${FS}" fill="#6c6c70" text-anchor="end">${v}</text>`;
    });
    // three time labels, centred, inset from the edges so none is clipped
    const inset = CH.timeLabelInset;
    [o.start + inset, o.start + CH.span / 2, o.start + CH.span - inset].forEach(t => {
      s += `<text x="${X(t)}" y="${B + 26}" font-size="${FS}" fill="#6c6c70" text-anchor="middle">${hhmm(t)}</text>`;
    });
    // yesterday, dashed grey, for comparison
    if (o.yesterday) {
      s += `<path d="${path(day1, o.start, END)}" fill="none" stroke="#a1a1a6" stroke-width="2" stroke-dasharray="5 4"/>`;
      s += `<text x="${X(peakT) + 16}" y="${Y(day1(peakT)) - 4}" font-size="${FS}" fill="#6c6c70">${esc(P.yesterdayLabel)}</text>`;
    }
    // main curve
    s += `<path d="${path(o.f, o.start, o.upto)}" fill="none" stroke="url(#lg-${id})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    // meal markers: white dot on the curve, label above the plot, thin dotted line down
    const meal = (t, label) => {
      const x = X(t), y = Y(o.f(t));
      return `<line x1="${x}" x2="${x}" y1="${T - 6}" y2="${y - 7}" stroke="#c7c7cc" stroke-dasharray="2 3"/>` +
        `<circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="#6c6c70" stroke-width="2"/>` +
        `<text x="${x}" y="${T - 12}" font-size="${FS}" fill="#3a3a3c" text-anchor="middle">${esc(label)}</text>`;
    };
    if (o.lunch && o.upto >= LUNCH) s += meal(LUNCH, CH.lunchLabel);
    if (o.snack) s += meal(SNACK, o.labels ? tpl(CONFIG.insight.labels.snack, LM) : P.snackLabel);
    // insight labels: peak and dip, placed clear of the meal lines
    if (o.labels) {
      const px = X(peakT), py = Y(day1(peakT)), dx = X(dipT), dy = Y(day1(dipT));
      s += `<circle cx="${px}" cy="${py}" r="5" fill="#d4520f" stroke="#fff" stroke-width="2"/>`;
      s += `<text x="${px - 30}" y="${py - 12}" font-size="${FS}" font-weight="600" fill="#b8460c">${esc(tpl(CONFIG.insight.labels.peak, LM))}</text>`;
      s += `<circle cx="${dx}" cy="${dy}" r="5" fill="#2c66b0" stroke="#fff" stroke-width="2"/>`;
      s += `<text x="${dx - 10}" y="${dy + 25}" font-size="${FS}" font-weight="600" fill="#2c66b0" text-anchor="end">${esc(tpl(CONFIG.insight.labels.dip, LM))}</text>`;
    }
    // current reading
    if (o.head) {
      const g = o.f(o.upto), cx = X(o.upto), cy = Y(g);
      const col = g > CH.high ? '#d4520f' : g < CH.low ? '#2c66b0' : '#1c1c1e';
      s += `<circle class="cursor-dot" cx="${cx}" cy="${cy}" r="6" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="5.5" fill="${col}" stroke="#fff" stroke-width="2"/>`;
    }
    return s;
  }

  /* ---------------- Render ---------------- */
  let homeKey = '', cardsKey = '';
  function render() {
    const now = S.t, v = valueAt(now), prev = valueAt(now - 5);
    // status bar
    $('sbTime').textContent = S.view === 'week' ? CONFIG.weekTime : hhmm(now);
    // reading
    const big = $('gVal'); big.textContent = Math.round(v);
    big.classList.toggle('high', v > CH.high); big.classList.toggle('low', v < CH.low);
    const rate = (v - prev) / 5, TR = P.trend;
    let ang = 0, label = TR.flat;
    if (rate > 2) { ang = -90; label = TR.up2; } else if (rate > 1) { ang = -45; label = TR.up1; }
    else if (rate < -2) { ang = 90; label = TR.down2; } else if (rate < -1) { ang = 45; label = TR.down1; }
    $('gArrow').style.transform = `rotate(${ang}deg)`;
    $('gTrend').textContent = label;
    $('dayPill').textContent = S.scene === 'd1' ? P.day1 : P.day2;
    // chart
    const walking = S.scene === 'd2' && S.choice === 'walk';
    const key = [S.scene, S.choice, now.toFixed(1)].join('|');
    if (key !== homeKey) {
      homeKey = key;
      const start = windowStart();
      $('chart').innerHTML = chartSVG({ id: 'h', start, upto: now, f: valueAt, lunch: S.scene !== 'morning', snack: snackShown(), yesterday: walking, head: true });
      $('chart').setAttribute('aria-label', `Glucose, ${hhmm(start)} to ${hhmm(start + CH.span)}`);
    }
    drawCards();
    drawControls();
  }

  function drawCards() {
    const st = stepsAt(S.t), walking = S.scene === 'd2' && S.choice === 'walk';
    const showSteps = S.scene !== 'morning' && S.t > LUNCH;
    const showEnd = walking && S.t >= END;
    const showDip = S.scene === 'd2' && S.choice === 'ignore' && S.t >= SNACK;
    const showOn = S.reminder === 'on' && S.scene !== 'd1';
    const key = [showSteps, showEnd, showDip].join('|');
    const stepVal = fmtInt(Math.round(st / 50) * 50), stepPct = Math.min(100, st / D2.walkSteps * 100).toFixed(1) + '%';
    if (key === cardsKey) {
      const sv = document.getElementById('stepsVal'), sb = document.getElementById('stepsBar');
      if (sv && sv.textContent !== stepVal) sv.textContent = stepVal;
      if (sb) sb.style.width = stepPct;
      return;
    }
    cardsKey = key;
    let h = '';
    if (showSteps) {
      const pct = Math.min(100, st / D2.walkSteps * 100);
      h += `<div class="pcard"><div class="steps-row"><span class="steps-lbl">${esc(P.stepsLabel)}<small>${esc(P.stepsSource)}</small></span><b id="stepsVal">${stepVal}</b></div><div class="bar"><i id="stepsBar" style="width:${pct.toFixed(1)}%"></i></div></div>`;
    }
    if (showEnd) h += `<div class="pcard good"><h4>${esc(P.walkEnd.title)}</h4><p>${esc(P.walkEnd.body)}</p></div>`;
    if (showDip) h += `<div class="pcard warn"><h4>${esc(P.dipBack.title)}</h4><p>${esc(P.dipBack.body)}</p></div>`;
    $('homeCards').innerHTML = h;
    if (showEnd || showDip) { const v = $('vHome'); v.scrollTo({ top: v.scrollHeight, behavior: 'smooth' }); }
  }

  function drawInsight() {
    const I = CONFIG.insight;
    $('insKick').textContent = I.kicker;
    $('insTitle').textContent = tpl(I.title, LM);
    $('insBody').textContent = tpl(I.body, LM);
    $('tipNum').textContent = I.tipNum; $('tipUnit').textContent = I.tipUnit;
    $('insTip').textContent = I.tip;
    $('insYes').textContent = I.primary; $('insNo').textContent = I.secondary;
    $('ichart').innerHTML = chartSVG({ id: 'i', start: toMin(D1.windowStart), upto: END, f: day1, lunch: true, snack: true, labels: true, head: false });
  }

  function drawWeek() {
    const W = CONFIG.week, items = S.reminder === 'on' ? W.on : W.off;
    $('weekTitle').textContent = W.title; $('weekBackLbl').textContent = W.back;
    $('weekBody').innerHTML = items.map(it => {
      let extra = '';
      if (it.note) extra = `<span>${esc(it.note)}</span>`;
      if (it.badge) extra = `<span class="${it.good ? 'ok' : 'meh'}">${esc(it.badge)}</span>`;
      return `<div class="wk-item"><p class="wk-lbl">${esc(it.label)}</p><div class="wk-val"><b>${esc(it.value)}</b>${extra}</div></div>`;
    }).join('');
  }

  /* ---------------- Controls and captions ---------------- */
  const BTN = { b1: 'start', b2: 'lunch1done', b3: 'snackdone', b4: 'insightdone', bWalk: 'lunch2wait', bIgnore: 'lunch2wait', b6: 'outcomedone' };
  function drawControls() {
    const cur = ORDER.indexOf(S.phase);
    Object.entries(BTN).forEach(([id, ph]) => {
      const b = $(id), enabled = S.phase === ph;
      b.disabled = !enabled;
      b.classList.toggle('next', enabled);
      b.classList.toggle('done', !enabled && cur > ORDER.indexOf(ph));
      const chosen = (id === 'bWalk' && S.choice === 'walk') || (id === 'bIgnore' && S.choice === 'ignore');
      b.classList.toggle('chosen', chosen);
      if (id === 'bWalk' || id === 'bIgnore') b.setAttribute('aria-pressed', String(chosen));
    });
  }
  function captionKey() {
    switch (S.phase) {
      case 'start': return 'start';
      case 'lunch1': case 'lunch1done': return 'lunch1';
      case 'snack': case 'snackdone': return 'snack';
      case 'insight': return 'insight';
      case 'insightdone': return S.reminder;
      case 'lunch2': case 'lunch2wait': return S.reminder === 'on' ? 'lunch2' : 'lunch2Off';
      case 'outcome': case 'outcomedone': return S.choice;
      default: return 'week';
    }
  }
  function caption() {
    const [kick, text] = CONFIG.captions[captionKey()];
    $('capKick').textContent = kick;
    $('note').textContent = text;
    $('noteM').textContent = text;
  }
  function setPhase(p) { S.phase = p; caption(); render(); }

  /* ---------------- Views, overlays ---------------- */
  function showView(v) {
    S.view = v;
    [['home', 'vHome'], ['insight', 'vInsight'], ['week', 'vWeek']].forEach(([k, id]) => $(id).classList.toggle('hidden', k !== v));
    if (v !== 'home') $(v === 'insight' ? 'vInsight' : 'vWeek').scrollTop = 0;
  }
  const showPush = on => $('push').classList.toggle('show', on);
  const showPerm = on => $('perm').classList.toggle('show', on);
  let snackTimer = null;
  function snack(msg) {
    const el = $('snack');
    el.innerHTML = '<svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="#30d158"/><path d="M5 9.2l2.6 2.6L13 6.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' + esc(msg);
    el.classList.add('show'); clearTimeout(snackTimer); snackTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  /* ---------------- Simulated clock ---------------- */
  function play(to, seconds, done) {
    if (S.raf) cancelAnimationFrame(S.raf);
    const from = S.t, t0 = performance.now(), run = S;
    const frame = now => {
      if (run !== S) return; // reset happened
      const k = Math.min(1, (now - t0) / (seconds * 1000));
      S.t = from + (to - from) * k;
      render();
      if (k < 1) S.raf = requestAnimationFrame(frame);
      else { S.raf = null; done(); }
    };
    S.raf = requestAnimationFrame(frame);
  }

  /* ---------------- Steps ---------------- */
  function step1() { if (S.phase !== 'start') return; setPhase('lunch1'); play(toMin(D1.pauseAt), CONFIG.anim.lunch1, () => setPhase('lunch1done')); }
  function step2() { if (S.phase !== 'lunch1done') return; setPhase('snack'); play(END, CONFIG.anim.snack, () => setPhase('snackdone')); }
  function step3() {
    if (S.phase !== 'snackdone') return;
    S.scene = 'morning'; S.t = toMin(CONFIG.morning.now);
    $('vHome').scrollTop = 0;
    showView('insight');
    setPhase('insight');
  }
  function answer(r) {
    if (S.phase !== 'insight') return;
    S.reminder = r;
    showPerm(false);
    showView('home');
    if (r === 'on') snack(P.snackbar);
    setPhase('insightdone');
  }
  function step4() {
    if (S.phase !== 'insightdone') return;
    S.scene = 'd2'; S.t = toMin(D2.start); S.choice = null;
    showView('home'); $('vHome').scrollTop = 0;
    setPhase('lunch2');
    play(TRIG, CONFIG.anim.lunch2, () => { if (S.reminder === 'on') showPush(true); setPhase('lunch2wait'); });
  }
  function choose(c) {
    if (S.phase !== 'lunch2wait') return;
    S.choice = c; showPush(false);
    setPhase('outcome');
    play(END, CONFIG.anim.outcome, () => setPhase('outcomedone'));
  }
  function step6() { if (S.phase !== 'outcomedone') return; drawWeek(); showView('week'); setPhase('week'); }

  function reset() {
    if (S && S.raf) cancelAnimationFrame(S.raf);
    S = fresh(); homeKey = ''; cardsKey = '';
    showPush(false); showPerm(false); $('snack').classList.remove('show');
    showView('home'); $('vHome').scrollTop = 0;
    setPhase('start');
  }

  /* ---------------- Static copy and wiring ---------------- */
  $('mTitle').textContent = CONFIG.page.title;
  $('mLine').textContent = CONFIG.page.line;
  $('mLink').textContent = CONFIG.page.link;
  $('homeTitle').textContent = P.homeTitle;
  Object.entries({ b1: 'b1', b2: 'b2', b3: 'b3', b4: 'b4', bWalk: 'walk', bIgnore: 'ignore', b6: 'b6' }).forEach(([id, k]) => { $(id).textContent = CONFIG.steps[k]; });
  $('pushApp').textContent = CONFIG.push.app; $('pushWhen').textContent = CONFIG.push.when;
  $('pushTitle').textContent = CONFIG.push.title; $('pushBody').textContent = CONFIG.push.body;
  $('permTitle').textContent = CONFIG.permission.title; $('permBody').textContent = CONFIG.permission.body;
  $('permDeny').textContent = CONFIG.permission.deny; $('permAllow').textContent = CONFIG.permission.allow;
  $('chartHead').textContent = CH.head;
  $('ichartHead').textContent = CH.headInsight;
  document.querySelectorAll('[data-unit]').forEach(el => { el.textContent = CH.unit; });
  document.querySelectorAll('[data-legend]').forEach(el => {
    el.innerHTML = `<span><i class="lg-band"></i>${esc(CH.legend.band)}</span><span><i class="lg-high"></i>${esc(CH.legend.high)}</span><span><i class="lg-low"></i>${esc(CH.legend.low)}</span>`;
  });
  drawInsight();

  $('b1').addEventListener('click', step1);
  $('b2').addEventListener('click', step2);
  $('b3').addEventListener('click', step3);
  $('b4').addEventListener('click', step4);
  $('bWalk').addEventListener('click', () => choose('walk'));
  $('bIgnore').addEventListener('click', () => choose('ignore'));
  $('b6').addEventListener('click', step6);
  $('bReset').addEventListener('click', reset);
  $('insYes').addEventListener('click', () => { if (S.phase === 'insight') showPerm(true); });
  $('insNo').addEventListener('click', () => { if (S.phase === 'insight') answer('notnow'); });
  $('permAllow').addEventListener('click', () => answer('on'));
  $('permDeny').addEventListener('click', () => answer('denied'));
  $('weekBack').addEventListener('click', () => { showView('home'); render(); });

  reset();
})();
</script>
</body>
</html>
