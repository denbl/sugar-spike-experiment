<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Walk off the sugar spike · Glow experiment prototype</title>
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#F1F3EE;
  --surface:#FFFFFF;
  --surface-2:#F7F8F5;
  --ink:#131C19;
  --ink-2:#38443F;
  --muted:#65716C;
  --line:#DCE0DA;
  --line-2:#E9ECE6;
  --brand:#0E6B5C;
  --brand-ink:#0A5145;
  --brand-soft:#E0EEE9;
  --spike:#BF641B;
  --spike-soft:#FAECDC;
  --control:#6C7773;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --s:.8;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;background:rgba(241,243,238,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-2)}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;text-decoration:none}
.mark i{width:22px;height:22px;border-radius:7px;background:var(--brand);display:grid;place-items:center}
.mark i::after{content:"";width:9px;height:9px;border-radius:50%;border:2px solid #fff}
.mark span{color:var(--muted);font-weight:400}
.topnav{display:flex;align-items:center;gap:4px;font-size:14px}
.topnav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2)}
.topnav a:hover{background:var(--line-2);color:var(--ink)}
.topnav a.alt{color:var(--brand-ink);border:1px solid var(--line);margin-left:6px}

/* ---------- Small parts ---------- */
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap;font-weight:500;background:transparent}
.tag.sim::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--spike)}
.tag.asm::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--brand)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:#C3C9C1}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:0 10px}
.btn.quiet:hover{color:var(--ink);background:var(--line-2)}
.btn[disabled]{opacity:.4;cursor:default}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:#E4E7E1;gap:2px}
.seg button{appearance:none;border:0;background:transparent;font-size:12.5px;font-weight:500;color:var(--ink-2);padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(19,28,25,.12)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer;--p:0%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--brand) var(--p),#D5DAD3 var(--p))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--brand);margin-top:-6px;box-shadow:0 1px 3px rgba(19,28,25,.2)}
.rng::-moz-range-track{height:4px;border-radius:2px;background:#D5DAD3}
.rng::-moz-range-progress{height:4px;border-radius:2px;background:var(--brand)}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:1.5px solid var(--brand)}

/* ---------- Phone ---------- */
.phone-wrap{position:relative;width:calc(412px*var(--s));height:calc(866px*var(--s));flex:none}
.device{position:absolute;left:0;top:0;width:412px;height:866px;transform:scale(var(--s));transform-origin:0 0;border-radius:66px;background:#0C0E0D;padding:11px;box-shadow:inset 0 0 0 1.5px #3A3F3C,inset 0 0 0 4px #151817,0 40px 70px -30px rgba(19,28,25,.45),0 12px 24px -12px rgba(19,28,25,.25)}
.screen{position:relative;width:390px;height:844px;border-radius:55px;overflow:hidden;background:#F2F2F7;color:#1C1C1E;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.35;isolation:isolate;-webkit-user-select:none;user-select:none}
.statusbar{position:absolute;inset:0 0 auto 0;height:54px;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:16px 30px 0 52px;font-weight:600;font-size:16.5px;letter-spacing:-.01em;pointer-events:none}
.statusbar .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.statusbar svg{display:block}
.home-ind{position:absolute;left:50%;bottom:8px;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:#1C1C1E;z-index:9;opacity:.9;pointer-events:none}
.view{position:absolute;inset:0;padding:58px 16px 96px;display:flex;flex-direction:column;gap:12px;transition:opacity .35s var(--ease),transform .45s var(--ease);background:#F2F2F7}
.view[hidden]{display:flex;opacity:0;pointer-events:none;transform:translateX(24px)}
.app-head{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 4px 0}
.app-date{font-size:13px;font-weight:600;color:#6E6E73;text-transform:uppercase;letter-spacing:.02em}
.app-title{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:40px;letter-spacing:.005em}
.avatar{width:36px;height:36px;border-radius:50%;background:#D7E6E1;color:#0E6B5C;font-weight:600;font-size:14px;display:grid;place-items:center;margin-bottom:3px}
.card{background:#fff;border-radius:20px;padding:15px 16px}
.c-label{font-size:13px;font-weight:600;color:#6E6E73}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#E0EEE9;color:#0A5145}
.pill.warn{background:#FAECDC;color:#9A4E12}
.gl-top{display:flex;justify-content:space-between;align-items:center}
.gl-main{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.gl-num{font-family:var(--font-round);font-size:62px;line-height:66px;font-weight:700;letter-spacing:-.02em;color:#1C1C1E;transition:color .3s}
.gl-num.hi{color:#BF641B}
.gl-unit{font-size:16px;color:#6E6E73;font-weight:500}
.gl-arrow{margin-left:auto;align-self:center;width:40px;height:40px;border-radius:50%;background:#F2F2F7;display:grid;place-items:center;color:#1C1C1E}
.gl-arrow svg{transition:transform .5s var(--ease)}
.gl-note{font-size:12.5px;color:#6E6E73;display:flex;align-items:center;gap:6px}
.gl-note::before{content:"";width:6px;height:6px;border-radius:50%;background:#1E9E7F}
.ch-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ch-head b{font-size:16px;font-weight:600}
.ch-head span{font-size:12px;color:#6E6E73}
.slot{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;min-height:96px;cursor:pointer;transition:background .2s;text-align:left;border:0;width:100%;font:inherit;color:inherit}
.slot .ico{width:40px;height:40px;border-radius:12px;background:#E0EEE9;color:#0E6B5C;display:grid;place-items:center}
.slot.amber .ico{background:#FAECDC;color:#BF641B}
.slot b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.slot p{font-size:13.5px;color:#55555A;line-height:1.3;margin-top:2px}
.slot .chev{color:#C4C4C7}
.slot .big{font-family:var(--font-round);font-size:22px;font-weight:700;text-align:right;line-height:1}
.slot .big small{display:block;font-family:inherit;font-size:11px;font-weight:500;color:#6E6E73;margin-top:3px}
.slot .bar{grid-column:1/-1;height:4px;border-radius:2px;background:#E5E5EA;overflow:hidden;margin-top:-2px}
.slot .bar i{display:block;height:100%;background:#0E6B5C;border-radius:2px}
.cart{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.cart b{font-size:15px;font-weight:600}
.cart span{font-size:13px;color:#6E6E73}
.cart .segs{grid-column:1/-1;display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.cart .segs i{height:5px;border-radius:3px;background:#E5E5EA}
.cart .segs i.on{background:#0E6B5C}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px 0;background:rgba(249,249,249,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid rgba(60,60,67,.2)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#8E8E93}
.tabbar div.on{color:#0E6B5C}
.sim-note{font-size:11px;color:#8A8A8E;text-align:center;margin-top:auto}

/* sheet, alert, banner */
.sheet{position:absolute;inset:0;z-index:6;background:#fff;padding:58px 22px 30px;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .5s var(--ease);border-radius:55px}
.sheet.open{transform:none}
.sheet-x{align-self:flex-end;width:30px;height:30px;border-radius:50%;border:0;background:#EEEEF0;color:#6E6E73;display:grid;place-items:center;cursor:pointer;margin-top:2px}
.sheet .eb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#0E6B5C;margin-top:2px}
.sheet h3{font-family:var(--font-display);font-size:29px;line-height:33px;font-weight:700;letter-spacing:-.01em;margin:4px 0 10px}
.sheet .lead{font-size:15px;color:#3C3C43;line-height:1.35}
.sheet .cta{margin-top:auto;height:54px;border-radius:15px;border:0;background:#0E6B5C;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.sheet .later{height:40px;border:0;background:transparent;color:#0E6B5C;font-size:16px;cursor:pointer;margin-top:2px}
.facts{display:grid;gap:9px;margin-top:12px}
.facts li{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:baseline;font-size:14px;line-height:1.3;color:#3C3C43}
.facts b{font-family:var(--font-round);font-size:18px;font-weight:700;color:#1C1C1E;letter-spacing:-.01em}
.promise{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:#F2F2F7;font-size:13.5px;color:#3C3C43;line-height:1.3}
.promise svg{flex:none;color:#0E6B5C}
.dia{background:#F5F7F6;border-radius:18px;padding:10px 12px 12px;margin-top:12px}
.chain{display:flex;align-items:center;justify-content:space-between;gap:2px;font-size:12.5px;font-weight:600;color:#1C1C1E;margin-top:4px}
.chain span{display:inline-flex;align-items:center;gap:5px}
.chain i{font-style:normal;width:17px;height:17px;border-radius:50%;background:#1C1C1E;color:#fff;font-size:10.5px;display:grid;place-items:center}
.chain em{font-style:normal;color:#AEAEB2}
.scrim{position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.28);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.ios-alert{width:272px;border-radius:14px;background:rgba(245,245,245,.96);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);text-align:center;transform:scale(1.12);transition:transform .3s var(--ease);overflow:hidden}
.scrim.open .ios-alert{transform:none}
.ios-alert .tx{padding:19px 16px 17px}
.ios-alert b{display:block;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.02em}
.ios-alert p{font-size:13px;line-height:17px;margin-top:3px;color:#1C1C1E}
.ios-alert .bt{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid rgba(60,60,67,.3)}
.ios-alert button{height:44px;border:0;background:transparent;color:#007AFF;font-size:17px;cursor:pointer}
.ios-alert button + button{border-left:.5px solid rgba(60,60,67,.3);font-weight:600}
.banner{position:absolute;left:9px;right:9px;top:50px;z-index:8;border-radius:24px;padding:13px 14px 14px;background:rgba(250,250,250,.86);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 10px 34px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06);display:grid;grid-template-columns:38px 1fr;gap:10px;transform:translateY(-190px);transition:transform .55s var(--ease)}
.banner.show{transform:none}
.banner .app-ico{width:38px;height:38px;border-radius:9px;background:#0E6B5C;display:grid;place-items:center;align-self:center}
.banner .app-ico::after{content:"";width:15px;height:15px;border-radius:50%;border:3px solid #fff}
.banner .hd{display:flex;justify-content:space-between;font-size:13px;color:#6E6E73}
.banner .hd b{color:#1C1C1E;font-weight:600;font-size:15px}
.banner p{font-size:15px;line-height:19px;color:#1C1C1E;letter-spacing:-.01em}

/* ---------- Charts ---------- */
.ch-band{fill:rgba(14,107,92,.09)}
.ch-edge{stroke:rgba(14,107,92,.35);stroke-width:1;stroke-dasharray:2 3}
.ch-tick{font-size:10.5px;fill:#8A8A8E;font-family:inherit}
.ch-tick.b{fill:rgba(14,107,92,.8)}
.ch-line{fill:none;stroke:#0E6B5C;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ch-line.hi{stroke:#D0782B}
.ch-line.ctl{stroke:#6C7773;stroke-width:2;stroke-dasharray:1 4.5}
.ch-line.ghost{stroke:#B4BAB6;stroke-width:2;stroke-dasharray:1 4.5}
.ch-dot{fill:#0E6B5C;stroke:#fff;stroke-width:2}
.ch-dot.hi{fill:#D0782B}
.ch-dot.ctl{fill:#6C7773}
.ch-halo{fill:rgba(14,107,92,.16)}
.ch-halo.hi{fill:rgba(208,120,43,.18)}
.ch-v{stroke:#131C19;stroke-width:1;stroke-dasharray:2 3;opacity:.55}
.ch-note{font-size:10.5px;fill:#38443F;font-weight:600;font-family:inherit}
.ch-val{font-size:11px;font-weight:700;fill:#131C19;font-family:inherit;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.ch-walk{fill:rgba(14,107,92,.75)}
.ch-num{fill:#1C1C1E}
.ch-numt{fill:#fff;font-size:10px;font-weight:700;font-family:inherit}

/* ---------- Sections ---------- */
.band{border-top:1px solid var(--line);padding:72px 24px 80px}
.band.alt{background:var(--surface-2)}
.wrap{max-width:1120px;margin:0 auto}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:40px;align-items:end;margin-bottom:40px}
.sec-head h2{font-family:var(--font-display);font-size:36px;line-height:1.1;letter-spacing:-.025em;font-weight:600;margin-top:10px}
.sec-head p{color:var(--ink-2);font-size:17px;line-height:1.5;max-width:56ch}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:24px}
.panel h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
footer.foot{border-top:1px solid var(--line);padding:28px 24px 44px;color:var(--muted);font-size:13px}
footer.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (max-width:820px){
  .topbar{padding:0 16px}
  .topnav a:not(.alt){display:none}
  .mark span{display:none}
  .band{padding:48px 16px 56px}
  .sec-head{grid-template-columns:1fr;gap:12px;margin-bottom:28px}
  .sec-head h2{font-size:28px}
  .sec-head p{font-size:16px}
  .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* ---------- Phone columns ---------- */
.duo{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.phones{display:flex;gap:32px;justify-content:center}
.pcol{display:flex;flex-direction:column;gap:12px}
.pcol-head{min-height:40px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;width:calc(412px*var(--s))}
.who{display:flex;flex-direction:column;line-height:1.25;flex:none}
.who b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.who b i{width:8px;height:8px;border-radius:50%}
.pcol.control .who b i{background:transparent;border:2px dotted;width:9px;height:9px}
.who span{font-size:14px;white-space:nowrap}
.pcol .seg{transition:opacity .2s}
.viewsw{display:none}

/* ---------- Experiment design ---------- */
.hyp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:40px;align-items:start}
.hyp .say{font-family:var(--font-display);font-size:23px;line-height:1.36;letter-spacing:-.015em;font-weight:500}
.hyp .say em{font-style:normal;color:var(--brand-ink)}
.evid li{display:grid;grid-template-columns:124px 1fr;gap:16px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.evid li:last-child{border-bottom:1px solid var(--line)}
.evid b{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--brand-ink);white-space:nowrap}
.evid p{font-size:14.5px;color:var(--ink-2);line-height:1.45}
.evid a{color:var(--muted);font-size:13px;white-space:nowrap}
.tl{display:grid;grid-template-columns:1.25fr 1.25fr 2fr 1.1fr;margin:44px 0 36px;position:relative}
.tl::before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:var(--line)}
.tl li{position:relative;padding:22px 16px 0 0;min-width:0}
.tl li::before{content:"";position:absolute;left:0;top:0;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.tl li.key::before{background:var(--brand);border-color:var(--brand)}
.tl b{display:block;font-size:14px;font-weight:600}
.tl span{font-size:13.5px;color:var(--ink-2);line-height:1.4;display:block;max-width:30ch}
.tl li:last-child{padding-right:0}
.tl li:last-child span{max-width:none}
.g3{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:16px}
.spec div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);font-size:14.5px;line-height:1.4}
.spec div:first-child{border-top:0;padding-top:0}
.spec dt{color:var(--muted);font-size:13px}
.metrics li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);font-size:14.5px;line-height:1.4;align-items:baseline}
.metrics li:first-child{border-top:0;padding-top:0}
.metrics .role{font-size:13px;color:var(--muted)}
.metrics li.key .role{color:var(--brand-ink);font-weight:600}
.metrics li.guard .role{color:var(--spike);font-weight:600}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.rules-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:36px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.rule{border-radius:18px;padding:20px 22px 22px;background:var(--surface);border:1px solid var(--line-2)}
.rule b{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.rule b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand)}
.rule.iterate b::before{background:#C9A227}
.rule.stop b::before{background:var(--spike)}
.rule p{font-size:14.5px;line-height:1.45;color:var(--ink-2);margin-top:8px}
.rule p span{color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:1px}

/* ---------- Week screen ---------- */
.wk-big{font-family:var(--font-round);font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.wk-big small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;font-weight:500;color:#6E6E73;letter-spacing:0}
.wk-dots{display:flex;gap:7px;margin-top:10px}
.wk-dots i{width:22px;height:22px;border-radius:50%;border:2px solid #D1D1D6}
.wk-dots i.on{background:#0E6B5C;border-color:#0E6B5C;position:relative}
.wk-dots i.on::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.wk-bar{display:grid;grid-template-columns:86px 1fr 92px;gap:10px;align-items:center;font-size:14px;margin-top:10px}
.wk-bar span{color:#3C3C43}
.wk-bar .tr{height:8px;border-radius:4px;background:#EEEEF0;overflow:hidden}
.wk-bar .tr i{display:block;height:100%;border-radius:4px;background:#0E6B5C}
.wk-bar.other .tr i{background:#D0782B}
.wk-bar b{font-weight:600;text-align:right;white-space:nowrap}
.wk-sub{font-size:13px;color:#6E6E73;margin-top:8px;line-height:1.3}


/* Cartridge in the Today header */
.hcart{display:grid;justify-items:end;gap:4px;margin-bottom:6px;width:150px}
.hcart span{font-size:12px;font-weight:600;color:#6E6E73;text-transform:uppercase;letter-spacing:.02em}
.hcart b{font-size:15px;font-weight:600;color:#1C1C1E}
.hcart .segs{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;width:100%}
.hcart .segs i{height:6px;border-radius:3px;background:#DADAE0}
.hcart .segs i.on{background:#0E6B5C}

/* ---------- Term with a tap definition ---------- */
.term-w{position:relative;display:inline}
.term{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px;text-decoration-thickness:1.5px}
.term-w.open .term{color:var(--brand-ink);text-decoration-color:var(--brand)}
.term-pop{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:30;width:260px;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;line-height:1.45;box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
.term-w.open .term-pop{display:block}

@media (max-width:1100px){
  .g3{grid-template-columns:1fr 1fr}
  .g3 .panel:last-child{grid-column:1/-1}
}
@media (max-width:700px){
  .hyp,.rules,.g3{grid-template-columns:1fr}
  .hyp{gap:24px}
  .evid li{grid-template-columns:1fr;gap:2px}
  .tl{grid-template-columns:1fr;margin:32px 0 28px;gap:0}
  .tl::before{left:5px;right:auto;top:6px;bottom:6px;width:1px;height:auto}
  .tl li{padding:0 0 18px 28px}
  .tl li::before{top:4px}
  .tl span{max-width:none}
}

/* ---------- Theme: dark stage for the story, light band for the experiment design ---------- */
:root{
  --ink:#0E1A16;
  --ink-2:#24332D;
  --muted:#44524C;
  --line:#CFDDD6;
  --line-2:#E1EBE6;
  --stage:#0B2B24;
  --stage-2:#123A31;
  --d-ink:#F4F8F5;
  --d-ink-2:#C9DED4;
  --d-line:rgba(255,255,255,.16);
  --mint:#6EE7B7;
  --mint-ink:#052019;
  --sun:#FFD166;
  --sun-soft:#FFF1C7;
  --sun-ink:#4D3A00;
  --spike-soft:#FFE4D1;
  --spike-ink:#7A3407;
}
html{background:var(--stage)}
::selection{background:var(--mint);color:var(--mint-ink)}

/* Top bar */
.topbar{background:rgba(11,43,36,.94);border-bottom:1px solid var(--d-line);color:var(--d-ink)}
.mark{color:var(--d-ink)}
.mark i{background:var(--mint)}
.mark i::after{border-color:var(--stage)}
.mark span{color:var(--d-ink-2)}

/* Phones on the stage */
.who b{color:#fff}
.who b i{background:var(--mint)}
.pcol.control .who b i{border-color:var(--d-ink-2)}
.who span{color:var(--d-ink-2)}
.scrolly .seg{background:rgba(255,255,255,.12)}
.scrolly .seg button{font-size:14px;color:var(--d-ink);padding:6px 10px}
.scrolly .seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
#flow[data-pre="1"] .pcol .seg{opacity:.45}
.device{box-shadow:inset 0 0 0 1.5px #3A3F3C,inset 0 0 0 4px #151817,0 0 0 1px rgba(255,255,255,.1),0 40px 80px -24px rgba(0,0,0,.65)}
.term{text-decoration-color:var(--d-ink-2)}
.term-w.open .term{color:var(--mint);text-decoration-color:var(--mint)}
.term-pop{background:#fff;color:var(--ink);font-size:15px;width:290px;box-shadow:0 16px 40px -12px rgba(0,0,0,.55)}

/* Labels: yellow for assumptions, orange for simulated data */
.tag{font-size:14px;letter-spacing:0;text-transform:none;font-weight:600;border:0;padding:4px 11px;background:var(--line-2);color:var(--ink-2)}
.tag.asm{background:var(--sun);color:var(--sun-ink)}
.tag.asm::before{background:var(--sun-ink)}
.tag.sim{background:var(--spike-soft);color:var(--spike-ink)}

/* Experiment design on a light band */
.band{border-top:0}
#experiment{background:#fff}
.sec-head{align-items:start}
.sec-head h2{font-size:42px;color:var(--ink);margin-top:0}
.sec-head p{font-size:18px;color:var(--ink-2)}
.panel{border-color:var(--line)}
.panel h3{font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700}
.hyp .say{font-size:26px;color:var(--ink)}
.evid b{font-size:22px}
.evid p{font-size:16px;line-height:1.5}
.evid a{font-size:15px;color:var(--brand-ink);font-weight:600}
.tl b{font-size:16px}
.tl span{font-size:15px;line-height:1.45}
.spec div,.metrics li{font-size:16px;line-height:1.45}
.spec dt,.metrics .role{font-size:15px;color:var(--ink-2);font-weight:600}
.rules-h{font-size:22px;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-weight:700;align-items:center}
.rule{border:0}
.rule.ship{background:#DDF4E8}
.rule.iterate{background:#FFF1C7}
.rule.stop{background:#FFE4D1}
.rule p{font-size:16px;color:var(--ink)}
.rule p span{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700}

footer.foot{background:var(--stage);color:var(--d-ink-2);border-top:0;font-size:14px}
@media (max-width:820px){
  .sec-head h2{font-size:32px}
  .hyp .say{font-size:22px}
}

/* =====================================================================
   Story on scroll: text blocks scroll in one column, the visual stays pinned in the other.
   --s (phone scale), --pinh (pinned height on narrow screens) and --dp (dot pitch) come from fit() in a.js.
   ===================================================================== */
:root{--s:.8;--pinh:0px;--dp:14px;--dr:14px;--top:56px}

/* ---------- Progress in the top bar ---------- */
.prog{display:flex;align-items:center;gap:2px;font-size:15px}
.prog a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;text-decoration:none;color:var(--d-ink-2);white-space:nowrap}
.prog a:hover{color:#fff;background:rgba(255,255,255,.08)}
.prog i{font-style:normal;font-size:14px;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.4)}
.prog li.done i{border-color:var(--mint);color:var(--mint)}
.prog li.on a{color:#fff;background:rgba(255,255,255,.12)}
.prog li.on i{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.prog-m{display:none;font-size:15px;font-weight:600;color:#fff}

/* ---------- Layout ---------- */
.scrolly{position:relative;background:var(--stage);color:var(--d-ink);padding:0 32px}
.story{display:grid;grid-template-columns:minmax(0,420px) auto;column-gap:72px;justify-content:center}
#flow .intro{grid-column:1;grid-row:1}
#flow .rail{grid-column:1;grid-row:2;margin-top:52px}
#flow .pin{grid-column:2;grid-row:1/3}
#model .rail{grid-column:1;grid-row:1}
#model .pin{grid-column:2;grid-row:1}
.pin{position:sticky;top:var(--top);height:calc(100vh - var(--top));align-self:start;display:flex;align-items:center;justify-content:center}
.pin-note{line-height:1}

/* ---------- Intro ---------- */
.intro{padding-top:48px;max-width:420px}
.intro h1{font-family:var(--font-display);font-size:clamp(40px,3.5vw,52px);line-height:1.03;letter-spacing:-.035em;font-weight:650;color:#fff;text-wrap:balance}
.intro .idea{font-size:18px;line-height:1.5;color:var(--d-ink);margin-top:18px}
.cue{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:16px;font-weight:600;color:var(--mint)}
.cue::before{content:"↓";display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--mint-ink);font-size:16px;font-weight:700;animation:nudge 1.8s var(--ease) infinite}
@keyframes nudge{0%,60%,100%{transform:none}30%{transform:translateY(5px)}}

/* ---------- Text blocks on a spine ---------- */
.rail{position:relative;padding:0 0 30vh 52px}
.rail::before{content:"";position:absolute;left:15px;top:6px;bottom:0;width:2px;background:var(--d-line)}
.step{position:relative;margin-bottom:32vh;opacity:.5;transition:opacity .3s}
.step.scrub{margin-bottom:62vh}
.step:last-child{margin-bottom:0}
.step.on{opacity:1}
.step h2{font-family:var(--font-display);font-size:30px;line-height:1.15;letter-spacing:-.022em;font-weight:650;color:#fff;text-wrap:balance}
.step p{font-size:18px;line-height:1.5;color:var(--d-ink);margin-top:10px}
.step p b{color:#fff}
.step .n{position:absolute;left:-52px;top:1px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:0;background:var(--stage);border:2px solid rgba(255,255,255,.4);color:var(--d-ink)}
.step.sub::before{content:"";position:absolute;left:-43px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--stage);border:2px solid rgba(255,255,255,.4)}
.step.done .n,.step.done.sub::before{border-color:var(--mint);color:var(--mint)}
.step.on .n,.step.on.sub::before{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.step .verdict{display:flex;gap:10px;align-items:baseline;font-weight:600;color:#fff}
.step .verdict::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--mint)}
.step .verdict.no::before{background:#FF9F5A}
#model .rail{padding-top:30vh;padding-bottom:72px}
#model .step{margin-bottom:30vh}
#model .step:last-child{margin-bottom:0}

/* ---------- Impact board: 1,000 dots, the funnel, the result ---------- */
.board{width:calc(var(--dp)*50)}
.board-h{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-bottom:14px}
.board-h h3{font-size:18px;font-weight:700;color:#fff;margin-right:auto}
.board-h .key{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:var(--d-ink)}
.board-h .key i{width:11px;height:11px;border-radius:50%;background:#3FB88D}
.dots{display:grid;grid-auto-flow:column;grid-template-rows:repeat(20,var(--dr));grid-auto-columns:var(--dp);place-items:center}
.dots i{width:calc(var(--dr)*.64);height:calc(var(--dr)*.64);border-radius:50%;background:rgba(255,255,255,.3);transition:background-color .35s}
.dots i.on{background:#3FB88D}
.dots i.dim{background:rgba(255,255,255,.12)}
.dots i.al{background:rgba(255,255,255,.5)}
.dots i.wk{background:#fff}
.dots i.mv{background:var(--mint);box-shadow:0 0 0 calc(var(--dr)*.1) rgba(110,231,183,.3)}
.dots i.gone{background:rgba(255,255,255,.1)}
.dots i.gone-on{background:rgba(63,184,141,.3)}
.fun{margin-top:14px}
.fun li{display:grid;grid-template-columns:11px 58px 1fr;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--d-line);font-size:17px;color:var(--d-ink);transition:opacity .35s,transform .35s var(--ease)}
.fun li:first-child{border-top:0}
.fun li i{width:11px;height:11px;border-radius:50%;align-self:center;background:rgba(255,255,255,.3);transition:opacity .35s}
.board.keep .fun li i{opacity:0}
.fun li:nth-child(2) i{background:rgba(255,255,255,.5)}
.fun li:nth-child(3) i{background:#fff}
.fun li:nth-child(4) i{background:var(--mint)}
.fun li b{font-family:var(--font-display);font-size:22px;font-weight:650;letter-spacing:-.02em;color:#fff;text-align:right}
.res{display:grid;grid-template-columns:1.18fr 1.18fr 1fr;gap:12px;margin-top:14px}
.rc{display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--d-line);border-radius:16px;padding:13px 16px 14px;background:var(--stage-2);transition:opacity .35s,transform .35s var(--ease)}
.rc > span{display:block;font-size:15px;line-height:1.3;color:var(--d-ink)}
.rc b{display:block;font-family:var(--font-display);font-size:calc(var(--dp)*1.85);line-height:1.15;font-weight:650;letter-spacing:-.03em;color:#fff;white-space:nowrap;margin-top:6px}
.rc b i{font-style:normal;font-weight:400;color:var(--d-ink-2);padding:0 .18em}
.rc b .from{color:var(--d-ink-2);font-weight:500}
.rc.money{background:var(--mint);border-color:var(--mint)}
.rc.money > span{color:var(--mint-ink)}
.rc.money b{color:var(--mint-ink)}
.board .off{opacity:0;transform:translateY(10px)}

/* ---------- Inputs: one panel at the end of the story ---------- */
.inputs{margin-top:18px;border:1px solid var(--d-line);border-radius:18px;background:var(--stage-2);padding:4px 18px 16px}
.inp{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:center;padding:10px 0 8px;border-top:1px solid var(--d-line)}
.inputs > .inp:first-child,.inp-group + .inp{border-top:0}
.inp label{font-size:16px;line-height:1.3;color:#fff}
.inp .num{display:inline-flex;align-items:center;gap:1px;border:1.5px solid rgba(255,209,102,.55);border-radius:8px;padding:2px 8px 2px 4px;font-size:16px;font-weight:700;color:var(--sun)}
.inp .num input{width:38px;border:0;background:transparent;font:inherit;color:inherit;text-align:right;padding:2px 0;-moz-appearance:textfield;appearance:textfield;font-variant-numeric:tabular-nums}
.inp .num input::-webkit-outer-spin-button,.inp .num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp .num input:focus{outline:none}
.inp .num:focus-within{border-color:var(--sun);background:rgba(255,209,102,.12)}
.inp .rng{grid-column:1/-1}
.inp small{grid-column:1/-1;font-size:14px;line-height:1.4;color:var(--d-ink-2)}
.inp-group{font-size:17px;font-weight:700;color:#fff;margin-top:6px;padding-top:16px;border-top:1px solid var(--d-line)}
.scrolly .rng::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--sun) var(--p),rgba(255,255,255,.22) var(--p))}
.scrolly .rng::-webkit-slider-thumb{border-color:var(--sun)}
.scrolly .rng::-moz-range-track{background:rgba(255,255,255,.22)}
.scrolly .rng::-moz-range-progress{background:var(--sun)}
.scrolly .rng::-moz-range-thumb{border-color:var(--sun)}
.model-foot{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:6px;padding-top:14px;border-top:1px solid var(--d-line)}
.model-foot span{font-size:14px;color:var(--d-ink-2)}
.scrolly .btn{background:transparent;border-color:rgba(255,255,255,.4);color:#fff;font-size:15px}
.scrolly .btn:hover{border-color:#fff}
.scrolly :focus-visible{outline-color:var(--mint)}

/* ---------- Formulas, collapsed ---------- */
.fxw{max-width:calc(524px + 824px*var(--s));margin:0 auto;padding:0 0 72px}
details.fx{border:1px solid var(--d-line);border-radius:18px;background:var(--stage-2);padding:16px 22px}
details.fx summary{list-style:none;cursor:pointer}
details.fx summary::-webkit-details-marker{display:none}
details.fx h3{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px;font-weight:700;color:#fff}
details.fx h3 > span:first-child{margin-right:auto}
details.fx h3 .tag{background:rgba(255,255,255,.12);color:var(--d-ink)}
details.fx h3::after{content:"Show";font-size:14px;font-weight:700;color:var(--mint-ink);background:var(--mint);border-radius:999px;padding:4px 14px}
details.fx[open] h3::after{content:"Hide"}
details.fx[open] summary{margin-bottom:12px}
.fx li{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:baseline;padding:9px 0;border-top:1px solid var(--d-line);font-size:15px}
.fx li span{color:var(--d-ink-2)}
.fx code{font-family:var(--mono);font-size:14px;line-height:1.6;color:var(--d-ink)}
.fx code b{color:var(--mint);font-weight:600}

/* ---------- Narrow screens: the visual is pinned on top, text scrolls under it ---------- */
@media (max-width:1100px){
  .prog{display:none}
  .prog-m{display:block}
  .scrolly{padding:0 16px;clip-path:inset(0)}
  .story{display:block}
  .intro{max-width:640px;padding:26px 0 22px}
  .intro h1{font-size:38px}
  .intro .idea{font-size:17px;margin-top:14px}
  .cue{margin-top:16px}
  .pin{display:block;height:var(--pinh);margin:0 -16px;padding:8px 16px 0;background:var(--stage);z-index:5}
  .pin::after{content:"";position:absolute;left:0;right:0;top:100%;height:26px;background:linear-gradient(var(--stage),rgba(11,43,36,0));pointer-events:none}
  .duo{gap:8px}
  .phones{gap:20px}
  .pcol{gap:6px}
  .who span{display:none}
  .phone-wrap{height:calc(610px*var(--s));overflow:hidden}
  .phone-wrap::after{content:"";position:absolute;left:-12px;right:-12px;bottom:0;height:34px;background:linear-gradient(rgba(11,43,36,0),var(--stage));pointer-events:none}
  #flow .rail{margin-top:0}
  .rail{padding:9vh 0 30vh 44px}
  .rail::before{left:13px}
  .step{margin-bottom:26vh}
  .step.scrub{margin-bottom:46vh}
  .step h2{font-size:24px}
  .step p{font-size:17px;margin-top:8px}
  .step .n{left:-44px;top:-1px;width:28px;height:28px;font-size:14px}
  .step.sub::before{left:-37px;top:7px}
  #model .pin{height:auto;padding-bottom:6px}
  #model .rail{padding-top:9vh;padding-bottom:56px}
  #model .step{margin-bottom:24vh}
  .board{margin:0 auto}
  .board-h{margin-bottom:8px}
  .board-h h3{font-size:16px}
  .fun{margin-top:8px}
  .fun li{grid-template-columns:10px 40px 1fr;gap:8px;padding:3px 0;font-size:15px;border-top:0}
  .fun li b{font-size:17px}
  .res{grid-template-columns:1fr;gap:5px;margin-top:8px}
  .rc{flex-direction:row;align-items:center;gap:10px;padding:5px 12px;border-radius:10px}
  .rc > span{font-size:14px}
  .rc b{font-size:17px;margin-top:0}
  .fx li{grid-template-columns:1fr;gap:2px}
  .fxw{padding-bottom:48px}
}
@media (min-width:701px) and (max-width:1100px){
  .rail{max-width:640px;margin-left:auto;margin-right:auto}
  .intro{margin:0 auto}
}
@media (max-width:700px){
  .duo{position:relative;align-items:stretch}
  .viewsw{display:block;position:absolute;left:0;top:0;z-index:2}
  .viewsw .seg button,.pcol .seg button{padding:7px 12px}
  .pcol{width:100%;align-items:center}
  .pcol-head{width:100%;justify-content:flex-end}
  .who{display:none}
  .pin-note{text-align:center}
  #flow[data-view="test"] .pcol.control,#flow[data-view="control"] .pcol.test{display:none}
}
@media (prefers-reduced-motion:reduce){
  .cue::before{animation:none}
}

/* No transitions while the page builds its first state */
.boot *,.boot *::before,.boot *::after{transition:none !important}

</style>
</head>
<body>
<header class="topbar" id="top"></header>
<main>
  <section class="scrolly" id="flow" aria-label="User flow"></section>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Monotone cubic interpolation through key points. Peaks stay exactly on the key points. */
function pchip(pts, m0) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), h = [], d = [];
  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; d[i] = (ys[i + 1] - ys[i]) / h[i]; }
  const m = new Array(n);
  m[0] = m0 === undefined ? d[0] : m0; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (3 * (h[i - 1] + h[i])) / ((2 * h[i] + h[i - 1]) / d[i - 1] + (h[i] + 2 * h[i - 1]) / d[i]);
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const t = (x - xs[i]) / h[i], t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h[i] * m[i + 1];
  };
}
const sample = (fn, a, b, step) => { const out = []; for (let x = a; x < b - 1e-9; x += step) out.push([x, fn(x)]); out.push([b, fn(b)]); return out; };

/* ---------- Chart ---------- */
function chartSVG(o) {
  const w = o.w, h = o.h, p = Object.assign({ l: 6, r: 30, t: 12, b: 20 }, o.pad);
  const X = v => p.l + (v - o.x[0]) / (o.x[1] - o.x[0]) * (w - p.l - p.r);
  const Y = v => p.t + (1 - (v - o.y[0]) / (o.y[1] - o.y[0])) * (h - p.t - p.b);
  const f = n => (Math.round(n * 10) / 10);
  const path = pts => pts.map((q, i) => (i ? 'L' : 'M') + f(X(q[0])) + ' ' + f(Y(q[1]))).join('');
  const yHi = Y(o.band[1]), yLo = Y(o.band[0]);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(o.label || 'Glucose chart')}" style="display:block;overflow:visible">`;
  s += `<defs><clipPath id="${o.id}-hi"><rect x="0" y="-20" width="${w}" height="${f(yHi + 20)}"/></clipPath><clipPath id="${o.id}-lo"><rect x="0" y="${f(yHi)}" width="${w}" height="${h}"/></clipPath></defs>`;
  s += `<rect class="ch-band" x="${f(X(o.x[0]))}" y="${f(yHi)}" width="${f(X(o.x[1]) - X(o.x[0]))}" height="${f(yLo - yHi)}" rx="2"/>`;
  s += `<line class="ch-edge" x1="${f(X(o.x[0]))}" x2="${f(X(o.x[1]))}" y1="${f(yHi)}" y2="${f(yHi)}"/><line class="ch-edge" x1="${f(X(o.x[0]))}" x2="${f(X(o.x[1]))}" y1="${f(yLo)}" y2="${f(yLo)}"/>`;
  s += `<text class="ch-tick b" x="${f(X(o.x[1]) + 5)}" y="${f(yHi + 3.5)}">${o.band[1]}</text><text class="ch-tick b" x="${f(X(o.x[1]) + 5)}" y="${f(yLo + 3.5)}">${o.band[0]}</text>`;
  (o.xticks || []).forEach(t => { s += `<text class="ch-tick" x="${f(X(t.x))}" y="${h - 4}" text-anchor="${t.anchor || 'middle'}">${esc(t.label)}</text>`; });
  (o.spans || []).forEach(sp => { s += `<rect class="ch-walk" x="${f(X(sp.x0))}" y="${f(h - p.b - 3)}" width="${f(Math.max(0, X(sp.x1) - X(sp.x0)))}" height="3" rx="1.5"/>`; });
  (o.vlines || []).forEach(v => { s += `<line class="ch-v" x1="${f(X(v.x))}" x2="${f(X(v.x))}" y1="${p.t - 2}" y2="${f(h - p.b)}"/>`; if (v.label) s += `<text class="ch-note" x="${f(X(v.x) + (v.anchor === 'end' ? -5 : 5))}" y="${v.low ? h - p.b - 9 : p.t + 6}" text-anchor="${v.anchor || 'start'}">${esc(v.label)}</text>`; });
  (o.series || []).forEach(se => {
    if (!se.pts || se.pts.length < 2) return;
    const d = path(se.pts);
    if (se.split) s += `<path class="ch-line" d="${d}" clip-path="url(#${o.id}-lo)"/><path class="ch-line hi" d="${d}" clip-path="url(#${o.id}-hi)"/>`;
    else s += `<path class="ch-line ${se.cls || ''}" d="${d}"/>`;
  });
  (o.dots || []).forEach(dt => {
    const cx = f(X(dt.x)), cy = f(Y(dt.y));
    if (dt.halo) s += `<circle class="ch-halo ${dt.cls || ''}" cx="${cx}" cy="${cy}" r="9"/>`;
    if (dt.num) s += `<circle class="ch-num" cx="${cx}" cy="${cy}" r="8.5"/><text class="ch-numt" x="${cx}" y="${f(Y(dt.y) + 3.5)}" text-anchor="middle">${dt.num}</text>`;
    else s += `<circle class="ch-dot ${dt.cls || ''}" cx="${cx}" cy="${cy}" r="${dt.r || 4.5}"/>`;
    if (dt.text) s += `<text class="${dt.textCls || 'ch-val'}" x="${f(X(dt.x) + (dt.dx || 0))}" y="${f(Y(dt.y) + (dt.dy === undefined ? -9 : dt.dy))}" text-anchor="${dt.anchor || 'middle'}">${esc(dt.text)}</text>`;
  });
  return s + '</svg>';
}

/* ---------- Impact model ---------- */
function sampleSize(p1, p2, z) {
  const d = p2 - p1;

}
function computeModel(v, z) {

  const m3t = onTest * v.retOn + (1 - onTest) * v.retOff;
  return { extra, moved, onTest, m3c, m3t, nOn: sampleSize(v.onTrack, onTest, z), nM3: sampleSize(m3c, m3t, z) };
}

  window.addEventListener('resize', () => { fit(); update(); });
  window.addEventListener('load', update);
  reduced.addEventListener('change', update);

  // Deep link for review and screenshots: #at=spike&walk=10&allow=0&view=control
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('allow') === '0') { st.deny = true; st.walk.test = false; }
  if (h.get('walk')) { st.walk.test = h.get('walk')[0] === '1'; st.walk.control = h.get('walk')[1] === '1'; }
  if (h.get('view')) st.view = h.get('view') === 'control' ? 'control' : 'test';
  fit(); renderModel();
  if (h.get('at') && stopIndex(h.get('at')) >= 0) goStop(stopIndex(h.get('at')), true);
  update(); render();
  setTimeout(() => document.documentElement.classList.remove('boot'), 60);
})();

</script>
</body>
</html>
